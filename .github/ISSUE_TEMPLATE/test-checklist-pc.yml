name: "\u2705 Character Bound Item Hider Test Checklist (PC)"
description: Run through Character Bound Item Hider's PC test checklist and report results
title: '[TEST][PC] '
labels:
- testing
assignees:
- MPHONlC
body:
- type: markdown
  attributes:
    value: Thanks for testing **Character Bound Item Hider** on PC! Check off everything you actually tested and confirmed working. Anything broken or partly working, describe it in the notes field at the end instead of checking it off.
- type: input
  id: version
  attributes:
    label: Add-on version
    placeholder: e.g. 2026.09.29.21.48
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    options:
    - PC (NA)
    - PC (EU)
    - PC (PTS)
  validations:
    required: true
- type: checkboxes
  id: pc_tests
  attributes:
    label: PC tests confirmed working
    options:
    - label: 'Load: Log in with Character Bound Item Hider on.'
    - label: 'Bank deposit: Open your bank, Deposit tab, with a character-bound item in your bag.'
    - label: 'House storage: Open a storage chest in a house, deposit side.'
    - label: 'Withdraw side: Look at the Withdraw tab.'
    - label: 'Other screens: Open guild bank deposit.'
    - label: 'Gamepad mode: On PC switch to gamepad mode and repeat the bank deposit test.'
    - label: 'Bound states: Deposit-side check with an unbound item, an account-bound item and a character-bound item.'
- type: textarea
  id: notes
  attributes:
    label: Anything broken, partly working, or not tested
    description: 'One line per issue: which test, what happened instead of Expected.'
    placeholder: 'e.g. PC-L-04 Bug report: popup opened but API version line was blank'
